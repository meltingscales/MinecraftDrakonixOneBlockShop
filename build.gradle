plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.170'
}

tasks.named('wrapper', Wrapper).configure {
    // Define wrapper values here so as to not have to always do so when updating gradlew.properties.
    // Switching this to Wrapper.DistributionType.ALL will download the full gradle sources that comes with
    // documentation attached on cursor hover of gradle classes and methods. However, this comes with increased
    // file size for Gradle. If you do switch this to ALL, run the Gradle wrapper task twice afterwards.
    // (Verify by checking gradle/wrapper/gradle-wrapper.properties to see if distributionUrl now points to `-all`)
    distributionType = Wrapper.DistributionType.BIN
}

version = mod_version
group = mod_group_id

repositories {
    mavenLocal()
    mavenCentral()
    exclusiveContent {
        forRepository {
            maven { url = 'https://api.modrinth.com/maven' }
        }
        filter { includeGroup 'maven.modrinth' }
    }
}

base {
    archivesName = mod_id
}

// Mojang ships Java 21 to end users starting in 1.20.5, so mods should target Java 21.
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

//minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')
//minecraft.accessTransformers.entry public net.minecraft.client.Minecraft textureManager # textureManager

// Default run configurations.
// These can be tweaked, removed, or duplicated as needed.
runs {
    // applies to all the run configs below
    configureEach {
        // Recommended logging data for a userdev environment
        // The markers can be added/remove as needed separated by commas.
        // "SCAN": For mods scan.
        // "REGISTRIES": For firing of registry events.
        // "REGISTRYDUMP": For getting the contents of all registries.
        systemProperty 'forge.logging.markers', 'REGISTRIES'

        // Recommended logging level for the console
        // You can set various levels here.
        // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
        systemProperty 'forge.logging.console.level', 'debug'

        modSource project.sourceSets.main
    }

    client {
        // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    server {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        argument '--nogui'
    }

    // This run config launches GameTestServer and runs all registered gametests, then exits.
    // By default, the server will crash when no gametests are provided.
    // The gametest system is also enabled by default for other run configs under the /test command.
    gameTestServer {
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
        // workingDirectory project.file('run-data')

        // Specify the modid for data generation, where to output the resulting resource, and where to look for existing resources.
        arguments.addAll '--mod', project.mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

// Bundle the repo-root GUIDE.md into the jar so StarterKit can read it at runtime
// without keeping a second copy in sync under src/main/resources.
tasks.named('processResources') {
    from(rootProject.file('GUIDE.md'))
}

// Sets up a dependency configuration called 'localRuntime'.
// This configuration should be used instead of 'runtimeOnly' to declare
// a dependency that will be present for runtime testing but that is
// "optional", meaning it will not be pulled by dependents of this mod.
configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    // Specify the version of Minecraft to use.
    // Depending on the plugin applied there are several options. We will assume you applied the userdev plugin as shown above.
    // The group for userdev is net.neoforged, the module name is neoforge, and the version is the same as the neoforge version.
    // You can however also use the vanilla plugin (net.neoforged.gradle.vanilla) to use a version of Minecraft without the neoforge loader.
    // And its provides the option to then use net.minecraft as the group, and one of; client, server or joined as the module name, plus the game version as version.
    // For all intends and purposes: You can treat this dependency as if it is a normal library you would use.
    implementation "net.neoforged:neoforge:${neo_version}"

    // Plain JUnit5 unit tests (src/test/java) - for logic that only needs vanilla registries
    // bootstrapped (Bootstrap.bootStrap()), not a running client/server. See PricingSeedTest.
    testImplementation platform('org.junit:junit-bom:5.10.2')
    testImplementation 'org.junit.jupiter:junit-jupiter'

    // Example optional mod dependency with JEI
    // The JEI API is declared for compile time use, while the full JEI artifact is used at runtime
    // compileOnly "mezz.jei:jei-${mc_version}-common-api:${jei_version}"
    // compileOnly "mezz.jei:jei-${mc_version}-neoforge-api:${jei_version}"
    // We add the full version to localRuntime, not runtimeOnly, so that we do not publish a dependency on it
    // localRuntime "mezz.jei:jei-${mc_version}-neoforge:${jei_version}"

    // Dev-only: loaded in runClient/runServer so Pricing's tag-based tech-mod prices
    // (pricing/seed_prices_by_tag.json) have something real to resolve against - Mekanism
    // supplies osmium, which is already seeded. localRuntime (not implementation/runtimeOnly)
    // so this is never a compile dependency and never gets published as a required dependency
    // of this mod - purely a local playtesting aid. Remove or bump the version freely; nothing
    // in our own code references Mekanism's classes.
    // Pinned to 10.7.14.79, not latest: it's the newest build that only needs
    // neoforge>=21.1.133 - everything from 10.7.15.81 on needs >=21.1.194, above our
    // neo_version (21.1.176). Bump this only alongside a real neo_version upgrade.
    localRuntime "maven.modrinth:mekanism:10.7.14.79"

    // Dev-only, same reasoning as Mekanism above - AE2's import bus is the case the tech-mod
    // item-pipe TODO cares about most. 19.2.17 (latest at time of writing) needs
    // neoforge>=21.1.169, satisfied by our neo_version (21.1.176), so latest works as-is.
    localRuntime "maven.modrinth:ae2:19.2.17"
    // AE2 hard-requires GuideMe (its in-game guide book library) - not obvious from AE2's own
    // page, only surfaced as a boot-time FATAL "requires guideme" until added. 21.1.17 (latest)
    // only needs neoforge>=21.1.1, compatible.
    localRuntime "maven.modrinth:guideme:21.1.17"

    // Dev-only, same reasoning - EnderIO conduits are the other named pipe-equivalent case.
    // NOT latest (8.2.11-beta needs neoforge==21.1.216, above our neo_version): pinned to
    // 7.1.8-alpha, the newest version whose neoforge.mods.toml only needs neoforge>=21.1.58.
    localRuntime "maven.modrinth:enderio:7.1.8-alpha"

    // GregTech CEu Modern removed for now - see FUTURE-MOD-COMPAT.md for the compatibility
    // details (version pin, dependency notes) to pick back up when it's re-added.

    // Fun/dev-only, no gameplay dependency on it - just makes sneak-spam speed up crop/sapling
    // growth so playtesting the shop's farmable-goods pricing doesn't require standing around.
    // Modrinth publishes separate fabric/forge/neoforge jars all labelled version "3.0.0", so
    // the plain semver string is ambiguous (resolved to the Fabric jar once, which NeoForge
    // then refused to load) - must pin the NeoForge release's specific Modrinth version id
    // (txp9wDw2) instead. Needs neoforge>=21.1.145, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:twerk-crop-growth:txp9wDw2"

    // Dev-only recipe/item viewer, useful while playtesting the shop's Buy/Sell tabs against
    // whatever's currently priced. Same version-number collision as twerk-crop-growth above
    // (JEI's forge/fabric/neoforge builds all share version number 19.39.0.372) - pinned to the
    // NeoForge release's Modrinth version id (zHNxmOqp). Its own neoforge.mods.toml needs
    // neoforge>=21.0.118-beta, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:jei:zHNxmOqp"

    // Dev-only, fells a whole tree in one hit - handy while playtesting since Sell/Explore
    // loops both want a lot of logs fast. No version-number collision across loaders for this
    // one (0.19.3 is neoforge-only on Modrinth), so the plain version string is unambiguous.
    // Needs neoforge>=21.0.167, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:treechop:0.19.3"

    // Dev-only, minimap + waypoints - handy for finding your way back to base after an
    // Explore-tab teleport. Version string is already loader-prefixed by Xaero
    // ("neoforge-1.21.1-26.4.2"), no collision with the forge/fabric builds. Needs
    // neoforge in [21.0.110-beta,21.2.0), satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:xaeros-minimap:neoforge-1.21.1-26.4.2"

    // Dev-only tooltip-HUD (shows what block/entity you're looking at). NOT literally WAILA -
    // WAILA itself has no NeoForge release at all (its last builds are 1.16.5-era Forge/Fabric,
    // see hwyla/waila-stages on Modrinth) - Jade is WAILA's actively-maintained modern
    // successor and what every current pack uses in its place. Version string is already
    // loader-suffixed ("15.10.5+neoforge"), no collision. Needs neoforge>=21.0.143, satisfied
    // by our neo_version (21.1.176).
    localRuntime "maven.modrinth:jade:15.10.5+neoforge"

    // Dev-only, mines a whole ore vein in one break - handy for the same reason as TreeChop
    // (Sell/Explore playtesting wants a lot of resources fast). Hard-requires KotlinLangForge
    // as a mod-loader-type language provider (its own neoforge.mods.toml declares
    // modLoader="klf", not "javafml"), not obvious from VeinMiner's own Modrinth listing.
    // Version string is already loader-prefixed ("veinminer-neoforge-2.11.2+1.21.1.jar" has a
    // matching "2.11.2" collision across fabric/quilt/folia/paper though, so pinned to the
    // NeoForge release's Modrinth version id). Needs neoforge>=21, minecraft>=1.21, both
    // satisfied.
    localRuntime "maven.modrinth:kotlin-lang-forge:2.12.2-k2.4.10-3.0+neoforge"
    localRuntime "maven.modrinth:veinminer:syKekkIm"

    // Dev-only QoL: bulk inventory sort/move-into-storage. No version-number collision (this
    // exact string is neoforge-only across its release history). Needs neoforge>=21.1.0,
    // satisfied by our neo_version (21.1.176). Client-side only.
    localRuntime "maven.modrinth:inventory-tweaks-refoxed:1.21.1-1.2.0"

    // Dev-only QoL: hunger/saturation HUD overlay, handy while playtesting hopper-automation
    // Sell loops that eat into food supply. No collision (unique to this neoforge build). Needs
    // neoforge>=21.0.0-beta, satisfied. Client-side only.
    localRuntime "maven.modrinth:appleskin:3.0.9+mc1.21"

    // Dev-only QoL: merges XP orbs, less lag/clutter around the guide book's suggested mob
    // farms. Version number "19.0.0.1" collides across forge/fabric/neoforge (all three loaders
    // share it) - pinned to the neoforge release's Modrinth version id instead. Needs
    // neoforge>=4 (effectively unconstrained) and minecraft==1.21.1, both satisfied.
    localRuntime "maven.modrinth:clumps:jo7lDoK4"

    // Dev-only, real parkour movement (wall-run/slide/mantle/roll) - the actual FastMove -
    // Parkour Movement mod the name evokes is Fabric/Quilt-only with zero Forge/NeoForge
    // releases ever (confirmed exhaustively against its full version history), so this is the
    // closest available substitute for a NeoForge project. "1.21.1-3.4.3.3" is unique to this
    // neoforge build, no collision. Its neoforge.mods.toml ships an unresolved
    // "${neo_forge_version}" template placeholder instead of a literal version range (likely a
    // build-config oversight on the author's end) - couldn't statically confirm the real
    // constraint, so this one's trusted on the boot-test alone, not the manifest.
    localRuntime "maven.modrinth:parcool:1.21.1-3.4.3.3"

    // Dev-only, geode-style ore veins (vanilla amethyst geode feature applied to other ores) -
    // fits this mod's own "sell raw resources" economy with more/better ore to gather. No
    // collision (unique to this neoforge build). Needs neoforge>=21.0.110-beta, satisfied.
    localRuntime "maven.modrinth:geore:6.2.3"

    // Dev-only, EMC-style item transmutation. The real ProjectE (and every fork/continuation of
    // it checked) has no Modrinth listing at all, not just missing this version - confirmed by
    // slug lookup, search, and a search by its original author (sinkillerj); likely
    // CurseForge-exclusive. Dissolver Enhanced is a real, actively-maintained substitute
    // explicitly "inspired by ProjectE and Equivalent Exchange" (its own Modrinth description).
    // Pinned by Modrinth project id (yEX3Y3na), not its slug - the slug has literal parentheses
    // ("...-item-transmutation-(emc)") that risk misparsing as a Gradle dependency coordinate.
    // No version-number collision (unique to this neoforge build). Needs neoforge in [21.0,22),
    // minecraft in [1.21,1.22), both satisfied by our pins.
    localRuntime "maven.modrinth:yEX3Y3na:1.5.31-neoforge-1.21.x"

    // Dev-only QoL, upgradeable backpacks with their own inventory tabs/filters/auto-sort -
    // useful given this mod's whole loop is fetch-and-carry (Sell trips, Explore-tab
    // expeditions). Hard-requires Sophisticated Core (its own shared library, not obvious from
    // this mod's own Modrinth page - only surfaced via its declared Modrinth dependency list).
    // No version-number collision for either (both unique to this neoforge build). Both need
    // neoforge>=21.1.0, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:sophisticated-core:1.21.1-1.4.80.2194"
    localRuntime "maven.modrinth:sophisticated-backpacks:1.21.1-3.25.73.2020"

    // Dev-only QoL, extends a placed block along a line/plane by consuming matching blocks from
    // inventory - less tedious building of long runs (floors/walls/tunnels). Hard-requires
    // Architectury API and Cloth Config API (its declared Modrinth dependencies, not obvious
    // from its own page). No version-number collisions (all three unique to their neoforge
    // builds). Needs neoforge>=21.1 (wands), >=21.0.110-beta (the other two), all satisfied by
    // our neo_version (21.1.176).
    localRuntime "maven.modrinth:architectury-api:13.0.11+neoforge"
    localRuntime "maven.modrinth:cloth-config:15.0.140+neoforge"
    localRuntime "maven.modrinth:building-wands:3.0.5_beta_neoforge_1.21.1"

    // Dev-only, general game-logic performance optimization (not a rendering mod like Sodium -
    // that's a separate, Fabric-only project). No collision (unique to this neoforge build), no
    // Modrinth-declared dependencies. Its own neoforge.mods.toml doesn't even constrain
    // neoforge's version (loaderVersion="*"), only minecraft in [1.21, 1.21.1], satisfied.
    localRuntime "maven.modrinth:lithium:mc1.21.1-0.15.4-neoforge"

    // Dev-only, adds whole new structures (fortresses, dungeons, etc.) with real loot - gives
    // this mod's Explore-tab teleports (now up to 1,000,000 blocks out, see Config.java) more
    // worth actually finding. Version number "2.1.68" collides across fabric/neoforge (both
    // loaders share it) - pinned to the neoforge release's Modrinth version id instead. Needs
    // neoforge>=21.0.0-beta, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:when-dungeons-arise:XIRJSFQ0"

    // Dev-only, points at the nearest structure of a chosen type - pairs well with the above,
    // since a random Explore-tab teleport plus this means "land somewhere, then find what's
    // nearby" instead of wandering blind. No version-number collision (unique to this neoforge
    // build). Needs neoforge>=21.0.0-beta, satisfied.
    localRuntime "maven.modrinth:explorers-compass:1.21.1-3.4.0-neoforge"

    // Dev-only, modern successor to Baubles (accessory slots) - Curios itself has no hard
    // dependents in this pack, added mainly so Artifacts below can use real accessory slots
    // instead of its no-Curios fallback. No collision (unique to this neoforge build). Needs
    // neoforge>=21.1.60, satisfied by our neo_version (21.1.176).
    localRuntime "maven.modrinth:curios:9.5.1+1.21.1"

    // Dev-only - its own Modrinth description: "Adds various treasure items that can be found
    // through exploration", an exact match for finding powerful gear while out on an Explore-tab
    // trip. Optionally integrates with Curios (added above) and Cloth Config (already have it,
    // from Building Wands) rather than hard-requiring either. Version number "13.2.1" collides
    // across fabric/neoforge (both loaders share it) - pinned to the neoforge release's Modrinth
    // version id instead. Needs neoforge>=21.0.133-beta, satisfied.
    localRuntime "maven.modrinth:artifacts:rGPw090r"

    // Dev-only tech mod, real deep automation (rotational "mechanical" power, not item-pipe-based
    // like AE2/Mekanism/EnderIO) - a genuinely different playstyle, and a good source of new
    // sellable materials. NOT latest (6.0.10+mc1.21.1 needs neoforge>=21.1.219, above our
    // neo_version): pinned to 6.0.0, the oldest 1.21.1 build on Modrinth, whose neoforge.mods.toml
    // only needs neoforge>=21.1.125, satisfied by our neo_version (21.1.176). No version-number
    // collision (unique to this neoforge build). Its two hard-required dependencies (flywheel,
    // ponder) plus Registrate are all jarjar'd inside Create's own jar (confirmed via its
    // META-INF/jarjar contents) - no separate localRuntime lines needed for them, same mechanism
    // already relied on for EnderIO's own nested jars.
    localRuntime "maven.modrinth:create:1.21.1-6.0.0"

    // Example mod dependency using a mod jar from ./libs with a flat dir repository
    // This maps to ./libs/coolmod-${mc_version}-${coolmod_version}.jar
    // The group id is ignored when searching -- in this case, it is "blank"
    // implementation "blank:coolmod-${mc_version}:${coolmod_version}"

    // Example mod dependency using a file as dependency
    // implementation files("libs/coolmod-${mc_version}-${coolmod_version}.jar")

    // Example project dependency using a sister or child project:
    // implementation project(":myproject")

    // For more info:
    // http://www.gradle.org/docs/current/userguide/artifact_dependencies_tutorial.html
    // http://www.gradle.org/docs/current/userguide/dependency_management.html
}

// This block of code expands all declared replace properties in the specified resource targets.
// A missing property will result in an error. Properties are expanded using ${} Groovy notation.
// When "copyIdeResources" is enabled, this will also run before the game launches in IDE environments.
// See https://docs.gradle.org/current/dsl/org.gradle.language.jvm.tasks.ProcessResources.html
tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version      : minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neo_version            : neo_version,
            neo_version_range      : neo_version_range,
            loader_version_range   : loader_version_range,
            mod_id                 : mod_id,
            mod_name               : mod_name,
            mod_license            : mod_license,
            mod_version            : mod_version,
            mod_authors            : mod_authors,
            mod_description        : mod_description
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml']) {
        expand replaceProperties
    }
}

// Example configuration to allow publishing using the maven-publish plugin
publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }
    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
}

tasks.named('test', Test).configure {
    useJUnitPlatform()
}

// IDEA no longer automatically downloads sources/javadoc jars for dependencies, so we need to explicitly enable the behavior.
idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
