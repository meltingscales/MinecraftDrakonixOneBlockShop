name: Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # See build.yml for why - NeoGradle's project-local decompile cache isn't covered by
      # setup-gradle's automatic ~/.gradle caching.
      - name: Cache NeoGradle project caches
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            build/neoForm
            build/jars
          key: neogradle-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Verify tag matches mod_version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PROP_VERSION="$(grep '^mod_version=' gradle.properties | cut -d= -f2)"
          if [ "$TAG_VERSION" != "$PROP_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME doesn't match gradle.properties mod_version=$PROP_VERSION"
            exit 1
          fi

      - name: Build with Gradle
        run: ./gradlew build

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/libs/*.jar
          generate_release_notes: true
