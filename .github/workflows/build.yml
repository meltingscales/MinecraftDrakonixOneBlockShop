name: Build

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Setup JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # setup-gradle already caches ~/.gradle (Gradle User Home) automatically. This covers
      # NeoGradle's project-local caches instead - the decompiled/patched/recompiled Minecraft
      # sources under build/neoForm, which are what actually make a from-scratch build slow.
      # Keyed on gradle.properties since that's what pins the MC/NeoForge/mappings versions -
      # no restore-keys fallback, so a version bump can't partially restore a stale cache.
      - name: Cache NeoGradle project caches
        uses: actions/cache@v4
        with:
          path: |
            .gradle
            build/neoForm
            build/jars
          key: neogradle-${{ runner.os }}-${{ hashFiles('gradle.properties') }}

      - name: Build with Gradle
        run: ./gradlew build

  modpack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Setup Go (for packwiz)
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Install packwiz
        run: go install github.com/packwiz/packwiz@latest

      # Catches drift between build.gradle's localRuntime pins and modpack/mods/*.pw.toml -
      # tools/generate_modpack.py resolves every pin against Modrinth's live API, so this fails
      # if a mod's version ever gets removed/yanked, not just if the two files disagree.
      - name: Regenerate and validate modpack
        run: |
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
          export PATH="$(go env GOPATH)/bin:$PATH"
          python3 tools/generate_modpack.py
          git diff --exit-code -- modpack/ || (echo "::error::modpack/ is out of sync with build.gradle - run 'just modpack-sync' and commit the result" && exit 1)